<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Registro | Portal Educativo Ángel Tech</title>

    <link rel="stylesheet" href="estilos_formulario.css">

</head>

<body>
    
    <<header class="encabezado">

    <h1>💻 Portal Educativo Ángel Tech</h1>

    <h2>Registro de Usuario</h2>

    <p>Completa el siguiente formulario para crear tu cuenta.</p>

 </header>

 <a     href="index.html" class="volver">⬅ Volver al Inicio</a>


    <div class="formulario">

        <form>

            <input type="text" placeholder="Nombre" required>
            <input type="text" placeholder="Apellido" required>
            <input type="email" placeholder="Correo Electronico" required>
            <input type="password" placeholder="Contraseña" required>

            <p>
                <label>
                    <input type="checkbox" required>
                    Acepto los términos y condiciones
                </label>
            </p>

           <input type="submit" value="🚀 Crear mi Cuenta">

            <p>
                ¿Ya tienes una cuenta?
                <a href="#">Inicia sesión</a>

            </p>

        </form>


    </div>


    
</body>
</html>
